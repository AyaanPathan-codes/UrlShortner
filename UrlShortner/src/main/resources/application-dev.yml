spring:
  application:
    name: UrlShortner
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    cache-names: "urlCache"
  datasource:
    url: jdbc:postgresql://localhost:5432/UrlShortner
    username: postgres
    password: s@yaanPathan10
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # create | create-drop | update | validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080 }

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET:changeme-local-dev-only-not-for-production}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 Hours (milliseconds)

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG


razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}